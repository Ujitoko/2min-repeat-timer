<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>2min Timer</title>
<meta name="theme-color" content="#1a1a2e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="2min Timer">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100dvh;
    background: #1a1a2e;
    color: #eee;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
  }
  .timer {
    font-size: clamp(80px, 25vw, 160px);
    font-variant-numeric: tabular-nums;
    font-weight: 200;
    letter-spacing: 4px;
    transition: color 0.3s;
  }
  .timer.warning { color: #e74c3c; }
  .round {
    font-size: 18px;
    color: #888;
    margin-bottom: 20px;
  }
  .btn {
    margin-top: 40px;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 3px solid #4fc3f7;
    background: transparent;
    color: #4fc3f7;
    font-size: 18px;
    cursor: pointer;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(0.93); }
  .btn.running { border-color: #e74c3c; color: #e74c3c; }
</style>
</head>
<body>
  <div class="round" id="round">ROUND 1</div>
  <div class="timer" id="timer">2:00</div>
  <button class="btn" id="btn" type="button">START</button>
<script>
  const DURATION = 120;
  const timerEl = document.getElementById('timer');
  const btnEl = document.getElementById('btn');
  const roundEl = document.getElementById('round');

  // ---- Audio ----
  // AudioContext はページ読み込み時ではなく最初のタップ時に作る。
  // 生成に失敗しても(API 無効・非対応など)タイマー本体は動き続ける。
  let actx = null;
  function getAudioContext() {
    if (actx) return actx;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) actx = new AC();
    } catch (e) {
      actx = null;
    }
    return actx;
  }
  function unlockAudio() {
    // ユーザー操作中に resume しておく(iOS の自動再生制限対策)
    const ctx = getAudioContext();
    if (!ctx) return;
    try {
      if (ctx.state !== 'running') {
        const p = ctx.resume();
        if (p && p.catch) p.catch(function () {});
      }
    } catch (e) {}
  }
  function playBeep() {
    const ctx = getAudioContext();
    if (ctx) {
      try {
        if (ctx.state !== 'running') ctx.resume();
        const t = ctx.currentTime;
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g);
        g.connect(ctx.destination);
        o.frequency.value = 880;
        g.gain.setValueAtTime(0.3, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
        o.start(t);
        o.stop(t + 0.5);
      } catch (e) {}
    }
    try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
  }

  // ---- Screen wake lock (対応ブラウザのみ。失敗しても無視) ----
  let wakeLock = null;
  function keepAwake(on) {
    try {
      if (on) {
        if (!wakeLock && navigator.wakeLock) {
          navigator.wakeLock.request('screen').then(function (lock) {
            wakeLock = lock;
            lock.addEventListener('release', function () { wakeLock = null; });
          }).catch(function () { wakeLock = null; });
        }
      } else if (wakeLock) {
        wakeLock.release().catch(function () {});
        wakeLock = null;
      }
    } catch (e) { wakeLock = null; }
  }

  // ---- Timer ----
  // カウントは setInterval の回数ではなく時刻ベースで行う。
  // バックグラウンドでタイマーが間引かれても、戻ってきた時に正しい残り時間になる。
  let running = false;
  let intervalId = null;
  let round = 1;
  let endAt = 0;                      // 現在ラウンドの終了時刻 (ms)
  let pausedMs = DURATION * 1000;     // 停止中の残り時間 (ms)

  function display(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    timerEl.textContent = m + ':' + String(s).padStart(2, '0');
    timerEl.classList.toggle('warning', sec <= 10 && sec > 0);
  }

  function tick() {
    const now = Date.now();
    if (now >= endAt) {
      // 複数ラウンド分経過していても一気に追従する(ビープは 1 回)
      const passed = Math.floor((now - endAt) / (DURATION * 1000)) + 1;
      round += passed;
      endAt += passed * DURATION * 1000;
      roundEl.textContent = 'ROUND ' + round;
      playBeep();
    }
    display(Math.ceil((endAt - now) / 1000));
  }

  function toggle() {
    if (running) {
      clearInterval(intervalId);
      intervalId = null;
      pausedMs = Math.max(0, endAt - Date.now());
      btnEl.textContent = 'START';
      btnEl.classList.remove('running');
      keepAwake(false);
    } else {
      unlockAudio();
      endAt = Date.now() + pausedMs;
      intervalId = setInterval(tick, 250);
      btnEl.textContent = 'STOP';
      btnEl.classList.add('running');
      keepAwake(true);
      tick();
    }
    running = !running;
  }

  btnEl.addEventListener('click', toggle);

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && running) {
      tick();          // 表示を即座に追従
      keepAwake(true); // 非表示時に解放された wake lock を再取得
    }
  });

  display(DURATION);

  // オフライン起動用の Service Worker(対応環境のみ。失敗しても無視)
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
